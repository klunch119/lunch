<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f1f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1613" media="(prefers-color-scheme: dark)">
<title>도시락 체크</title>
<style>
  /* 도시락 체크 웹앱(구글 Apps Script)을 화면 가득 보여 주는 껍데기 페이지예요. */
  :root { color-scheme: light dark; --bg: #f1f4f1; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1613; } }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  iframe { display: block; border: 0; width: 100%; height: 100vh; height: 100dvh; }
</style>
</head>
<body>
<iframe id="app" title="도시락 체크" allow="clipboard-write"></iframe>
<script>
  // 웹앱 주소. 웹앱을 다시 배포해도 이 주소는 바뀌지 않아요.
  var APP = "https://script.google.com/macros/s/AKfycbynmEXlmxeR9SgHagXqLhFZsXNO_Q_cpX3qaLYqjnfYm5PnYUrxB5fu19WwPb49FWxk/exec";
  var page = new URLSearchParams(location.search).get("page");
  if (page !== "admin" && page !== "order") page = "";
  var host = location.origin + location.pathname.replace(/index\.html$/, "");
  var src = APP + "?host=" + encodeURIComponent(host) + (page ? "&page=" + page : "");
  document.getElementById("app").src = src;
  if (page === "admin") document.title = "도시락 체크 관리";
  if (page === "order") document.title = "도시락 주문";
</script>
</body>
</html>
